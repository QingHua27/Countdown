# ============================================================
#  C++ 倒计时器 配置文件
#  修改后保存，下次运行生效。以 # 或 ; 开头的行为注释。
# ============================================================

# ---- 提示音 ----
# 可以是：
#   1) 声音文件，支持 .wav / .mp3 / .mid 等
#      相对路径相对于 exe 所在目录，也可以写绝对路径，例如
#      sound = C:\Windows\Media\Alarm01.wav
#   2) Windows 系统声音别名，例如
#      sound = SystemExclamation
#      sound = SystemHand
#   3) 留空表示使用系统默认提示音
sound = alarm.wav

# 是否循环播放提示音（true / false）
loop = true

# 是否额外播放一声系统"叮"（true / false）
beep = false

# ---- 弹窗 ----
# 是否弹出提示窗口
popup = true

# 弹窗标题
title = 倒计时结束

# 弹窗内容。{time} 会被替换为本次倒计时的总时长
# 需要换行请写 \n
message = 时间到！\n\n倒计时 {time} 已经结束。

# 结束时是否闪烁任务栏图标
flash = true
